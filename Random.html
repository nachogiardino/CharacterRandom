<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Protagonistas - IA Consistencia</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .btn-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #718096;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .btn-card .value {
            font-size: 1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .btn-card.active {
            border-color: var(--primary);
            background-color: #f5f3ff;
        }

        .actions {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-main:hover {
            opacity: 0.9;
        }

        .result-box {
            background: #f8fafc;
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 0 12px 12px 0;
        }

        .result-box h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .result-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a5568;
            margin: 0;
        }

        .highlight {
            color: var(--primary);
            font-weight: 600;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧬 Creador Aleatorio de Personajes (UGC)</h1>
    
    <div class="grid-buttons">
        <button class="btn-card" onclick="getRandom('edad')">
            <span class="label">Edad</span>
            <span class="value" id="val-edad">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('etnia')">
            <span class="label">Origen / Etnia</span>
            <span class="value" id="val-etnia">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('colorCabello')">
            <span class="label">Color de Cabello</span>
            <span class="value" id="val-colorCabello">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('cortePelo')">
            <span class="label">Corte de Pelo</span>
            <span class="value" id="val-cortePelo">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('colorOjos')">
            <span class="label">Color de Ojos</span>
            <span class="value" id="val-colorOjos">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('marcas')">
            <span class="label">Marcas Únicas</span>
            <span class="value" id="val-marcas">Haz clic para elegir</span>
        </button>
        
        <button class="btn-card" onclick="getRandom('estilo')">
            <span class="label">Estilo de Vestimenta</span>
            <span class="value" id="val-estilo">Haz clic para elegir</span>
        </button>
    </div>

    <div class="actions">
        <button class="btn-main" onclick="randomizeAll()">🎲 Sorpréndeme (Todo Aleatorio)</button>
    </div>

    <div class="result-box">
        <h2>📋 Prompt / Descripción de la Protagonista:</h2>
        <p class="result-text" id="paragraph">Haz clic en los botones de arriba para empezar a diseñar la estructura del personaje...</p>
    </div>
</div>

<script>
    // Base de datos extraída de tus clusters
    const dataset = {
        edad: ["Gen Z (18-24)", "Millennial (25-35)", "Madura (40-50)", "Senior (60+)"],
        etnia: ["Latina", "Nórdica", "Afrodescendiente", "Asiática", "Mediterránea", "Andina"],
        colorCabello: ["rubia platinada", "pelirroja cobriza", "morocha oscura", "castaña con balayage", "pelo de colores (rosa pastel, mechones azules)"],
        cortePelo: ["un bob corto y recto", "un cabello largo con rulos voluminosos", "un cabello lacio hasta la cintura", "un corte con flequillo tupido", "un corte pixie (muy corto)", "trenzas africanas"],
        colorOjos: ["marrones muy oscuros", "celestes transparentes", "color miel/avellana", "verdes", "heterocromía (un ojo de cada color)"],
        marcas: ["pecas muy marcadas en nariz y mejillas", "un lunar cerca del labio", "vitiligo", "cejas muy gruesas y despeinadas", "hoyuelos al sonreír", "un piercing en el septum", "brackets", "un tatuaje pequeño en el cuello"],
        estilo: ["Clean girl aesthetic (minimalista, tonos neutros)", "Streetwear / Urbana (ropa oversize, zapatillas)", "Coquette (moños, tonos pastel, romántica)", "Corporate Core (traje sastre moderno, de oficina)", "Gamer/Geek (auriculares, remeras gráficas)"]
    };

    // Estado actual de la selección
    const currentSelection = {
        edad: null,
        etnia: null,
        colorCabello: null,
        cortePelo: null,
        colorOjos: null,
        marcas: null,
        estilo: null
    };

    // Función para obtener una característica aleatoria de una categoría
    function getRandom(category) {
        const options = dataset[category];
        const randomIndex = Math.floor(Math.random() * options.length);
        const selectedValue = options[randomIndex];
        
        currentSelection[category] = selectedValue;
        
        // Actualizar la interfaz del botón
        const valueSpan = document.getElementById(`val-${category}`);
        valueSpan.innerText = selectedValue;
        valueSpan.parentElement.classList.add('active');
        
        updateParagraph();
    }

    // Función para randomizar todas las categorías a la vez
    function randomizeAll() {
        Object.keys(dataset).forEach(category => {
            getRandom(category);
        });
    }

    // Función que arma el párrafo dinámicamente de forma natural
    function updateParagraph() {
        // Formateadores por si faltan datos al inicio
        const edad = currentSelection.edad ? `<span class="highlight">${currentSelection.edad}</span>` : "[edad]";
        const etnia = currentSelection.etnia ? `<span class="highlight">${currentSelection.etnia}</span>` : "[origen/etnia]";
        const colorCabello = currentSelection.colorCabello ? `<span class="highlight">${currentSelection.colorCabello}</span>` : "[color de cabello]";
        const cortePelo = currentSelection.cortePelo ? `<span class="highlight">${currentSelection.cortePelo}</span>` : "[corte de pelo]";
        const colorOjos = currentSelection.colorOjos ? `<span class="highlight">${currentSelection.colorOjos}</span>` : "[color de ojos]";
        const marcas = currentSelection.marcas ? `<span class="highlight">${currentSelection.marcas}</span>` : "[rasgo distintivo]";
        const estilo = currentSelection.estilo ? `<span class="highlight">${currentSelection.estilo}</span>` : "[estilo/vibe]";

        // Construcción del texto descriptivo
        const paragraphText = `La protagonista es una mujer de origen ${etnia} perteneciente al rango de edad ${edad}. Su rostro queda perfectamente enmarcado por ${cortePelo} de tono ${colorCabello}, haciendo juego ideal con sus ojos ${colorOjos}. Como marca de identidad e imperfección única que ancla su consistencia, cuenta con ${marcas}. Finalmente, proyecta toda su energía y actitud a través de una vestimenta de estilo ${estilo}.`;

        document.getElementById('paragraph').innerHTML = paragraphText;
    }
</script>

</body>
</html>
